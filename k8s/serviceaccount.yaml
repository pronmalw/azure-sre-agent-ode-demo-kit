apiVersion: v1
kind: ServiceAccount
metadata:
  name: contoso-retail-api
  namespace: contoso-retail
  annotations:
    # Client ID of the user-assigned managed identity id-contoso-retail-api.
    # Federated to system:serviceaccount:contoso-retail:contoso-retail-api so the
    # pod can call ARM (rotating the VPN Gateway IPsec key for real chaos).
    azure.workload.identity/client-id: "f3f57d64-f5a9-4337-8e8a-ffde11bceccb"
  labels:
    azure.workload.identity/use: "true"
