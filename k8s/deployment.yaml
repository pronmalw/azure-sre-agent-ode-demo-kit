apiVersion: apps/v1
kind: Deployment
metadata:
  name: contoso-retail-api
  namespace: contoso-retail
  labels:
    app: contoso-retail-api
spec:
  # Single replica on purpose: chaos toggles are in-process state. With more
  # than one replica a toggle only reaches the pod the load balancer picked,
  # so the scenario signals become inconsistent mid-demo.
  replicas: 1
  selector:
    matchLabels:
      app: contoso-retail-api
  template:
    metadata:
      labels:
        app: contoso-retail-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: contoso-retail-api
      containers:
        - name: api
          image: <ACR_NAME>.azurecr.io/contoso-retail-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: contoso-retail-config
                  key: NODE_ENV
            - name: COSMOS_DATABASE_ID
              valueFrom:
                configMapKeyRef:
                  name: contoso-retail-config
                  key: COSMOS_DATABASE_ID
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: contoso-retail-config
                  key: PORT
            - name: AZURE_SUBSCRIPTION_ID
              valueFrom:
                configMapKeyRef:
                  name: contoso-retail-config
                  key: AZURE_SUBSCRIPTION_ID
            - name: AZURE_RESOURCE_GROUP
              valueFrom:
                configMapKeyRef:
                  name: contoso-retail-config
                  key: AZURE_RESOURCE_GROUP
            - name: VPN_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: contoso-retail-config
                  key: VPN_CONNECTION_NAME
            - name: VPN_GATEWAY_NAME
              valueFrom:
                configMapKeyRef:
                  name: contoso-retail-config
                  key: VPN_GATEWAY_NAME
            - name: APPINSIGHTS_CLOUD_ROLE
              valueFrom:
                configMapKeyRef:
                  name: contoso-retail-config
                  key: APPINSIGHTS_CLOUD_ROLE
            - name: VPN_HEALTHY_SHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: contoso-retail-secrets
                  key: VPN_HEALTHY_SHARED_KEY
            - name: COSMOS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: contoso-retail-secrets
                  key: COSMOS_ENDPOINT
            - name: COSMOS_KEY
              valueFrom:
                secretKeyRef:
                  name: contoso-retail-secrets
                  key: COSMOS_KEY
            - name: THROTTLE_COSMOS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: contoso-retail-secrets
                  key: THROTTLE_COSMOS_ENDPOINT
            - name: THROTTLE_COSMOS_KEY
              valueFrom:
                secretKeyRef:
                  name: contoso-retail-secrets
                  key: THROTTLE_COSMOS_KEY
            - name: SQL_SERVER
              valueFrom:
                secretKeyRef:
                  name: contoso-retail-secrets
                  key: SQL_SERVER
            - name: SQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: contoso-retail-secrets
                  key: SQL_DATABASE
            - name: SQL_USER
              valueFrom:
                secretKeyRef:
                  name: contoso-retail-secrets
                  key: SQL_USER
            - name: SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: contoso-retail-secrets
                  key: SQL_PASSWORD
            - name: APPINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: contoso-retail-secrets
                  key: APPINSIGHTS_CONNECTION_STRING
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health/live
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            # Probes target the dependency-free liveness endpoint. The demo
            # deliberately degrades Cosmos, SQL and CPU; a probe that checked
            # those would evict the pod mid-scenario and wipe the in-process
            # chaos state, turning a degraded backend into a full outage.
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contoso-retail-web
  namespace: contoso-retail
  labels:
    app: contoso-retail-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contoso-retail-web
  template:
    metadata:
      labels:
        app: contoso-retail-web
    spec:
      containers:
        - name: web
          image: <ACR_NAME>.azurecr.io/contoso-retail-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
