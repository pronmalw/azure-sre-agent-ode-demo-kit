apiVersion: apps/v1
kind: Deployment
metadata:
  name: contoso-retail-api
  namespace: contoso-retail
  labels:
    app: contoso-retail-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contoso-retail-api
  template:
    metadata:
      labels:
        app: contoso-retail-api
    spec:
      containers:
        - name: api
          image: <ACR_NAME>.azurecr.io/contoso-retail-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: contoso-retail-config
                  key: NODE_ENV
            - name: COSMOS_DATABASE_ID
              valueFrom:
                configMapKeyRef:
                  name: contoso-retail-config
                  key: COSMOS_DATABASE_ID
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: contoso-retail-config
                  key: PORT
            - name: COSMOS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: contoso-retail-secrets
                  key: COSMOS_ENDPOINT
            - name: COSMOS_KEY
              valueFrom:
                secretKeyRef:
                  name: contoso-retail-secrets
                  key: COSMOS_KEY
            - name: SQL_SERVER
              valueFrom:
                secretKeyRef:
                  name: contoso-retail-secrets
                  key: SQL_SERVER
            - name: SQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: contoso-retail-secrets
                  key: SQL_DATABASE
            - name: SQL_USER
              valueFrom:
                secretKeyRef:
                  name: contoso-retail-secrets
                  key: SQL_USER
            - name: SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: contoso-retail-secrets
                  key: SQL_PASSWORD
            - name: APPINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: contoso-retail-secrets
                  key: APPINSIGHTS_CONNECTION_STRING
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contoso-retail-web
  namespace: contoso-retail
  labels:
    app: contoso-retail-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contoso-retail-web
  template:
    metadata:
      labels:
        app: contoso-retail-web
    spec:
      containers:
        - name: web
          image: <ACR_NAME>.azurecr.io/contoso-retail-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
